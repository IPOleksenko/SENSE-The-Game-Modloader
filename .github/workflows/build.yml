name: Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit information
        id: info
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"   >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -S app/src/main
          -B build_x86_64
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="/D_WIN32_WINNT=0x0601 /DNTDDI_VERSION=0x06010000"
          -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0601 /DNTDDI_VERSION=0x06010000"

      - name: Build
        run: cmake --build build_x86_64 --config Release

      # ── Collect artifacts ────────────────────────────────────────────────────

      # Shared helper: copy base launcher & API DLL
      - name: Collect core files (shared base)
        shell: pwsh
        run: |
          $src = "build_x86_64/Release"
          foreach ($dst in @("dist/core", "dist/achievements", "dist/full")) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item "$src/SENSE_THE_GAME_MODLOADER.exe"     $dst -Force
            Copy-Item "$src/SENSE_THE_GAME_MODLOADER_api.dll" $dst -Force
          }
          # steam_api64.dll is only included in achievements and full flavors
          foreach ($dst in @("dist/achievements", "dist/full")) {
            if (Test-Path "$src/steam_api64.dll") {
              Copy-Item "$src/steam_api64.dll" $dst -Force
            }
          }

      # achievements — core + only steam_achievements.dll in mods/
      - name: Collect achievements release
        shell: pwsh
        run: |
          $modsDir = "build_x86_64/Release/mods"
          New-Item -ItemType Directory -Force -Path "dist/achievements/mods" | Out-Null
          if (Test-Path "$modsDir/steam_achievements.dll") {
            Copy-Item "$modsDir/steam_achievements.dll" "dist/achievements/mods/" -Force
          }
          # steam_api64.dll must also be inside mods/ (inject.cpp loads it from there)
          if (Test-Path "build_x86_64/Release/steam_api64.dll") {
            Copy-Item "build_x86_64/Release/steam_api64.dll" "dist/achievements/mods/" -Force
          }
          if (Test-Path "$modsDir/SENSE_THE_GAME_MODLOADER_api.dll") {
            Copy-Item "$modsDir/SENSE_THE_GAME_MODLOADER_api.dll" "dist/achievements/mods/" -Force
          }

      # full — core + entire mods/ folder
      - name: Collect full release
        shell: pwsh
        run: |
          $src = "build_x86_64/Release"
          if (Test-Path "$src/mods") {
            Copy-Item "$src/mods" "dist/full/" -Recurse -Force
          }

      # ── Pack ZIPs ────────────────────────────────────────────────────────────

      - name: Pack ZIPs
        id: zips
        shell: pwsh
        run: |
          $tag  = "${{ steps.info.outputs.short_sha }}"
          $core = "modloader-core-windows-x86_64-${tag}.zip"
          $ach  = "modloader-achievements-windows-x86_64-${tag}.zip"
          $full = "modloader-full-windows-x86_64-${tag}.zip"

          Compress-Archive -Path dist/core/*         -DestinationPath $core
          Compress-Archive -Path dist/achievements/* -DestinationPath $ach
          Compress-Archive -Path dist/full/*         -DestinationPath $full

          echo "core_zip=$core" >> $env:GITHUB_OUTPUT
          echo "ach_zip=$ach"   >> $env:GITHUB_OUTPUT
          echo "full_zip=$full" >> $env:GITHUB_OUTPUT

      # ── Upload CI artifacts (available on every PR too) ───────────────────────

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: modloader-core-windows-x86_64-${{ steps.info.outputs.short_sha }}
          path: ${{ steps.zips.outputs.core_zip }}

      - name: Upload achievements artifact
        uses: actions/upload-artifact@v4
        with:
          name: modloader-achievements-windows-x86_64-${{ steps.info.outputs.short_sha }}
          path: ${{ steps.zips.outputs.ach_zip }}

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: modloader-full-windows-x86_64-${{ steps.info.outputs.short_sha }}
          path: ${{ steps.zips.outputs.full_zip }}

      # ── GitHub Release (main branch pushes only) ─────────────────────────────

      # Delete every existing release + its tag so only the latest one survives.
      - name: Delete old releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | while read -r tag; do
                echo "Deleting release and tag: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.short_sha }}
          name: "${{ steps.info.outputs.short_sha }}"
          body: |
            ## SENSE Modloader — Windows x86_64

            | | |
            |---|---|
            | **Commit** | `${{ steps.info.outputs.short_sha }}` |
            | **SHA** | `${{ steps.info.outputs.commit_sha }}` |
            | **Author** | `${{ github.actor }}` |
            | **Config** | `Release` |

            ### Downloads

            | File | Contents |
            |---|---|
            | `modloader-core-…zip` | Launcher + API DLL |
            | `modloader-achievements-…zip` | Launcher + API DLL + steam_api64.dll + Steam achievements mod |
            | `modloader-full-…zip` | Launcher + API DLL + steam_api64.dll + all mods |

            ### Commit message

            ${{ github.event.head_commit.message }}
          files: |
            ${{ steps.zips.outputs.core_zip }}
            ${{ steps.zips.outputs.ach_zip }}
            ${{ steps.zips.outputs.full_zip }}
          generate_release_notes: false